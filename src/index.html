<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Code Editor</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="sidebar">
      <div id="sidebar_title"><center>Code Editor</center></div>

      <div id="file_manager">
          <div id="file_manager_title" onclick="open_files_dialog()" title="Click to open files (Ctrl+O)">
              Open Files
          </div>

      </div>

      <div id="folder_manager">
          <div id="folder_manager_title" onclick="open_folders_dialog()" title="Click to open a folder">
              Folders
          </div>
      </div>


      <div id="sidebar_timer"><center>00:00:00</center></div>
    </div>

    <div id="toolbar">
      <button class="tool_button" onclick="new_file()">New</button>
      <button class="tool_button" onclick="open_files_dialog()">Open</button>
      <button class="tool_button" onclick="open_folders_dialog()">Folder</button>
      <button class="tool_button" onclick="save_file()">Save</button>
      <button class="tool_button" onclick="save_as()">Save As</button>
      <button class="tool_button" onclick="open_find()">Find</button>
      <button class="tool_button" id="wrap_button" onclick="toggle_word_wrap()">Word Wrap: off</button>
      <button class="tool_button" onclick="open_settings()">Settings</button>
    </div>

    <div id="editor">

      <center><div id="empty_hint">Drop files here or press Ctrl+O</div></center>

    </div>


    

    <script src="./js/main.js"></script>
    <script src="./js/Ace/ace.js" defer></script>
    <script src="./js/Ace/ext-language_tools.js" defer></script>
    <script src="./js/Ace/ext-modelist.js" defer></script>
    <script src="./js/Ace/ext-searchbox.js" defer></script>
    <script src="./js/Ace/ext-prompt.js" defer></script>
    <script src="./js/Ace/ext-settings_menu.js" defer></script>
    <script src="./js/file_manager.js" defer></script>
    <script src="./js/editor.js" defer></script>
    <script src="./js/timer.js" defer></script>
  </body>
</html>
